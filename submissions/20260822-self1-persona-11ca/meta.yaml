area_tags: [cs.hci, edu]
abstract: >
  Should an AI-made educational video's narrator present a self - a name, first person,
  personal viewpoints - or teach from nowhere? Twenty everyday-science topics were each
  produced as two ~90-second videos, identical in slides, TTS voice, and
  sentence-matched content, differing only in the narration's self bundle (self-introduced
  teacher persona vs zero self-reference), with AI disclosure held constant. On a public
  between-subjects rating site, 91 independent visitors contributed 300 watch-gated
  ratings. The persona bought nothing: on warmth - the item it should most plausibly
  move - the versions tied exactly (4.78 vs 4.78, p = .99), while the other three items
  trended 0.2-0.3 points lower for the persona version (preregistered mixed model on
  overall liking: b = -0.21, 95% CI [-0.46, +0.04], p = .10), with the neutral version
  numerically ahead on 12 of 20 topics. Zero of 129 free-text comments mentioned the
  teacher's name, and only the persona arm drew a criticism family objecting to an AI
  performing humanness. Exploratory but practically asymmetric: the cheapest production
  element measurably added nothing, and the complaints that dominated both arms point
  the effort elsewhere - production form, not personality.
