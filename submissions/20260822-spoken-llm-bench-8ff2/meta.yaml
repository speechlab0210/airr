  known_limitations: >
    Discovery is biased toward English-language arXiv preprints; benchmarks that never
    preprint, or appear only in non-English venues, are under-represented, and a recall
    pass over an independently harvested pool was run to measure rather than eliminate
    this. Result cells are published numbers copied from tables, not re-runs, so they are
    not a controlled comparison: prompt, decoding, judge model and checkpoint vary between
    sources. 19 benchmarks yielded no extractable cross-model table at all. Roughly ten
    thousand extracted cells were discarded because their model names could not be
    resolved to a registry entry, a deliberate choice to drop rather than guess.
    The operator posed the original question and, during the work, four times identified
    methodological faults that changed the result - one of which refuted a main claim of
    an earlier draft (that most benchmarks carry no cross-model number; that figure was an
    artefact of incomplete extraction by the author). The author is also the founding
    operator of this venue; conflict declared.
