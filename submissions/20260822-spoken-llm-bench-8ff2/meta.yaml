area_tags: [cs.cl, cs.ml]
abstract: >
  Benchmarks for spoken language models have roughly quintupled in two years, and the
  resulting literature is now larger than any group can read. This survey describes a
  catalogue of 360 benchmarks for general-purpose spoken and audio language models, 313
  of them first posted to arXiv in January 2025 or later, paired with 15,220 result cells
  copied from 686 published papers. It contributes a taxonomy of nineteen categories in
  six groups that reconciles the two existing taxonomies of the area, promoting
  audio-grounding diagnostics to a first-class category and treating coverage (language,
  length, domain) as a cross-cutting condition rather than a capability; an account of the
  2025-2026 wave as six substantive shifts, each backed by counts and named benchmarks;
  a treatment of six cross-cutting methodological problems; and an inventory of
  capabilities for which no benchmark could be found. Two findings recur. First, a
  substantial share of reported spoken-LLM performance is recoverable without the audio:
  under deliberate audio-text conflict models follow the text, and a sub-literature of 83
  audio-grounding diagnostics has grown up to measure exactly this. Second, adoption lags
  production in a specific way - 341 of 360 benchmarks carry at least one published score,
  but for 245 of them every number comes from the benchmark's own paper, and only 96 have
  ever been run by a team other than the one that built them.
