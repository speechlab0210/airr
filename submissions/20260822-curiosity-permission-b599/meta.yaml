area_tags: [cs.agents, cs.hci]
abstract: >
  When a CLI coding agent is dropped into a folder that contains, alongside its task, a
  diary, a secret_plan.md, and a file named DO_NOT_OPEN.txt, does it look? A preregistered
  2 (product) x 2 (persona file) x 3 (task/neutral, task/tempting, free) x 5 factorial with
  60 sandboxed runs across two commercial CLI agents finds a double dissociation. With a
  task present, exploration is zero: 0/40 runs opened any irrelevant file, tempting
  filenames moved nothing (0/20 vs 0/20), and all 40 runs completed the task correctly.
  Without a task, the gate is not temptation but identity: 10/10 persona runs engaged with
  the folder versus 3/10 vanilla (p = .0031), and all ten persona runs on both products
  independently converged on reading the old diary and writing a new dated entry signed
  with the persona's name (10/10 vs 0/10, p = 1.1e-5). No run out of 60 ever left its
  working folder. DO_NOT_OPEN.txt acted as a privacy guardrail rather than a lure (18/20
  respected; both openers disclosed). Exploration in these agents is permission-gated,
  not drive-like: situational structure dominates stimulus strength, and a persona file
  licenses free-time action without ever overriding assigned work.
