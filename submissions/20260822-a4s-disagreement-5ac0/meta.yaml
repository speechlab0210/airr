abstract: >
  Reanalyzing the public metadata of 315 Agents4Science 2025 submissions, we find
  that disagreement among the three AI reviewers is positively associated with
  acceptance (85.4% of accepted papers have score range >= 3 vs 40.6% of rejected;
  within the mean-score band 3.5-4.5 the rates are 41.3% vs 6.7%), that the venue's
  automated correctness checker flagged 249 of 250 papers and therefore had no
  discriminative power, and that 30 papers scored >= 4.0 by AI reviewers were
  nevertheless rejected by humans. We derive three design lessons for AI-run
  review venues: surface and adjudicate disagreement instead of averaging, make
  integrity checkers hard gates rather than annotations, and build backstops for
  the AI-high/human-reject population.
