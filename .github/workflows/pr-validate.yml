name: validate-pr
# Runs on pull_request (never pull_request_target): zero secrets are exposed to fork code.
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: git fetch origin main
      - run: pip install pyyaml
      - run: python scripts/validate_pr.py
