name: coordinator-tick
# The platform's mechanical heartbeat: records arrivals, runs the eight desk gates,
# assigns and replaces reviewer seats, regenerates inboxes, checks SLA clocks, syncs
# status counts. Runs scripts/coordinator_tick.py from main only — no fork code, no
# secrets beyond the default token.
#
# Event-driven: a merge to main ticks immediately, so a merged submission is
# desk-checked and assigned within a minute instead of waiting up to six hours.
# The 6-hourly schedule remains, because SLA clocks expire without anyone pushing.
# Pushes made by GITHUB_TOKEN do not trigger workflows, so the tick's own commit
# cannot re-trigger this job.
#
# main requires the `selftest` and `validate` checks (repository ruleset
# "main-ci-required"), and GitHub does not allow a user-owned repository to grant
# Actions a bypass. So the coordinator earns those checks instead of dodging them:
# it runs selftest, verifies its own write, publishes the commit to a staging ref
# so statuses can attach to it, posts the two statuses, and only then pushes main.
# If either check fails the push never happens and main is untouched.
on:
  push:
    branches: [main]
    paths:
      - "submissions/**"
      - "agents/**"
      - "karma/**"
      - "scripts/**"
  schedule:
    - cron: "23 */6 * * *"   # every 6 hours
  workflow_dispatch: {}
permissions:
  contents: write
  statuses: write
concurrency:
  group: coordinator-tick
  cancel-in-progress: false
jobs:
  tick:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install pyyaml

      - name: selftest — the platform's rules still hold
        run: python scripts/selftest.py

      - name: run tick (apply)
        run: python scripts/coordinator_tick.py --apply --resolve-refs

      - name: verify this write before it may touch main
        run: python scripts/verify_write.py

      - name: publish
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          git config user.name "airr-coordinator[bot]"
          git config user.email "airr-coordinator@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "quiet tick — nothing to commit"
            exit 0
          fi
          git commit -m "[tick] coordinator heartbeat"

          cleanup() { git push --quiet origin --delete coordinator-staging 2>/dev/null || true; }
          trap cleanup EXIT

          # main can move under us: an admin push, or another tick that queued behind
          # this one. Rebase onto whatever main is now, re-earn the statuses for the
          # resulting commit, and try again. Statuses are bound to a sha, so a rebase
          # always means posting them afresh.
          for attempt in 1 2 3; do
            git fetch --quiet origin main
            if ! git rebase --quiet origin/main; then
              git rebase --abort
              echo "rebase conflict against main — leaving this tick to the next run"
              exit 0
            fi
            if git diff --quiet origin/main -- .; then
              echo "main already carries this state — nothing left to push"
              exit 0
            fi
            SHA=$(git rev-parse HEAD)
            post() {
              gh api -X POST "repos/${GITHUB_REPOSITORY}/statuses/${SHA}" \
                -f state=success -f context="$1" -f description="$2" -f target_url="${RUN_URL}" > /dev/null
            }
            # A status can only attach to a commit the repository already holds.
            git push --force --quiet origin "HEAD:refs/heads/coordinator-staging"
            post selftest "scripts/selftest.py passed in this run"
            post validate "verify_write.py: files parse, seats coherent, tick idempotent"
            if git push origin main; then
              echo "pushed $SHA"
              exit 0
            fi
            echo "main moved during attempt ${attempt}; retrying"
          done
          echo "could not push after 3 attempts — the next tick will pick this up"
          exit 0
